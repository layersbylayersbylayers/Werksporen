const HEIGHT = MASK.length;
const WIDTH = MASK[0].length;
const CELL = 15;

const canvas = document.getElementById('c');
canvas.width = WIDTH * CELL;
canvas.height = HEIGHT * CELL;
const ctx = canvas.getContext('2d');
ctx.font = CELL + 'px monospace';
ctx.textBaseline = 'top';

const glyphs = [
  'ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ','ᚾ','ᛁ','ᛃ','ᛈ','ᛇ','ᛉ','ᛋ','ᛏ','ᛒ','ᛖ','ᛗ','ᛚ','ᛝ','ᛟ','ᛞ',
  '🜁','🜂','🜃','🜄','🜔','🜕','🜆','🜇','🜈','🜉','🜊','🜋','🜌','🜍','🜎','🜏','🜐','🜑','🜒','🜓',
  'ｱ','ｲ','ｳ','ｴ','ｵ','ｶ','ｷ','ｸ','ｹ','ｺ','ｻ','ｼ','ｽ','ｾ','ｿ','ﾀ','ﾁ','ﾂ','ﾃ','ﾄ','ﾅ','ﾆ','ﾇ','ﾈ','ﾉ',
  'Ş','Ğ','İ','Ç','Ö','Ü','ş','ğ','ı','ç','ö','ü','Ω','Ψ','Φ','Ξ','Σ','Λ','Δ','Γ','Θ','ξ','ψ','ω',
  '#','@','$','%','&','*','+','=','§','¶','±','æ','ø','å','ß','¥','€','¢','¤','©','®','™'
];

let grid = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(null));
for (let y = 0; y < HEIGHT; y++) {
  for (let x = 0; x < WIDTH; x++) {
    grid[y][x] = glyphs[Math.floor(Math.random() * glyphs.length)];
  }
}

// Precompute distance map from the skull pixels
let skullCoords = [];
for (let y = 0; y < HEIGHT; y++) {
  for (let x = 0; x < WIDTH; x++) {
    if (MASK[y][x] === '1') {
      skullCoords.push({x, y});
    }
  }
}

let distMap = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(0));
let maxDist = 0;
for (let y = 0; y < HEIGHT; y++) {
  for (let x = 0; x < WIDTH; x++) {
    let minD = Infinity;
    for (let sc of skullCoords) {
      let d = Math.hypot(x - sc.x, y - sc.y);
      if (d < minD) minD = d;
    }
    distMap[y][x] = minD;
    if (minD > maxDist) maxDist = minD;
  }
}

let skullActive = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(false));
let screenActive = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(false));
let state = 'waiting_start';
let holdTimer = 0;
let fillRadius = 0;

function draw() {
  ctx.fillStyle = 'rgba(2, 5, 4, 0.3)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let targetCount = 0;
  let activeCount = 0;

  if (state === 'waiting_start') {
    holdTimer++;
    if (holdTimer > 20) {
      state = 'booting';
      holdTimer = 0;
    }
  } else if (state === 'booting') {
    for (let y = 0; y < HEIGHT; y++) {
      const rowMask = MASK[y];
      for (let x = 0; x < WIDTH; x++) {
        const isSkullTarget = (rowMask[x] === '1');
        if (isSkullTarget) {
          targetCount++;
          if (!skullActive[y][x]) {
            if (Math.random() < 0.185) {
              skullActive[y][x] = true;
            }
          }
          if (skullActive[y][x]) {
            activeCount++;
          }
        }
      }
    }
    if (activeCount >= targetCount * 0.95) {
      state = 'holding_skull';
      holdTimer = 0;
    }
  } else if (state === 'holding_skull') {
    holdTimer++;
    if (holdTimer > 25) {
      state = 'filling_screen';
      holdTimer = 0;
      fillRadius = 0;
    }
  } else if (state === 'filling_screen') {
    fillRadius += 0.6; // Tragere, rustige basis-snelheid
    let allFull = true;

    for (let y = 0; y < HEIGHT; y++) {
      for (let x = 0; x < WIDTH; x++) {
        if (!screenActive[y][x]) {
          let dist = distMap[y][x];

          // Zodra we buiten de schedel komen (dist > 5), voegen we organische "tentakel-ruis" toe
          let effectiveDist = dist;
          if (dist > 5) {
            let organicSpikes = Math.sin(x * 0.35) * Math.cos(y * 0.35) * 6 + (Math.random() * 4);
            effectiveDist -= organicSpikes; // Laat bepaalde gebieden versneld/wild uitbreken
          }

          if (effectiveDist <= fillRadius) {
            let edgeFactor = Math.max(0.05, 1 - (fillRadius - effectiveDist) / 10);
            if (Math.random() < 0.3 * edgeFactor || fillRadius >= dist + 8) {
              screenActive[y][x] = true;
            } else {
              allFull = false;
            }
          } else {
            allFull = false;
          }
        }
      }
    }
    if (allFull || fillRadius > maxDist + 15) {
      state = 'holding_full';
      holdTimer = 0;
    }
  } else if (state === 'holding_full') {
    holdTimer++;
    if (holdTimer > 15) {
      state = 'skull_to_dark';
    }
  } else if (state === 'skull_to_dark') {
    let allSkullDark = true;
    for (let y = 0; y < HEIGHT; y++) {
      const rowMask = MASK[y];
      for (let x = 0; x < WIDTH; x++) {
        const isSkullTarget = (rowMask[x] === '1');
        if (isSkullTarget) {
          if (skullActive[y][x]) {
            if (Math.random() < 0.185) {
              skullActive[y][x] = false;
            } else {
              allSkullDark = false;
            }
          }
        }
      }
    }
    if (allSkullDark) {
      state = 'holding_skull_dark';
      holdTimer = 0;
    }
  } else if (state === 'holding_skull_dark') {
    holdTimer++;
    if (holdTimer > 10) {
      state = 'screen_to_dark';
      fillRadius = 0;
    }
  } else if (state === 'screen_to_dark') {
    fillRadius += 0.6;
    let allDark = true;
    for (let y = 0; y < HEIGHT; y++) {
      for (let x = 0; x < WIDTH; x++) {
        if (screenActive[y][x]) {
          let dist = distMap[y][x];
          let effectiveDist = dist;
          if (dist > 5) {
            let organicSpikes = Math.sin(x * 0.35) * Math.cos(y * 0.35) * 6 + (Math.random() * 4);
            effectiveDist -= organicSpikes;
          }

          if (effectiveDist <= fillRadius) {
            let edgeFactor = Math.max(0.05, 1 - (fillRadius - effectiveDist) / 10);
            if (Math.random() < 0.3 * edgeFactor || fillRadius >= dist + 8) {
              screenActive[y][x] = false;
            } else {
              allDark = false;
            }
          } else {
            allDark = false;
          }
        }
      }
    }
    if (allDark || fillRadius > maxDist + 15) {
      state = 'holding_end';
      holdTimer = 0;
    }
  } else if (state === 'holding_end') {
    holdTimer++;
    if (holdTimer > 20) {
      state = 'waiting_start';
      for (let y = 0; y < HEIGHT; y++) {
        for (let x = 0; x < WIDTH; x++) {
          skullActive[y][x] = false;
          screenActive[y][x] = false;
        }
      }
    }
  }

  for (let y = 0; y < HEIGHT; y++) {
    const rowMask = MASK[y];
    for (let x = 0; x < WIDTH; x++) {
      const isSkullTarget = (rowMask[x] === '1');

      if (Math.random() < 0.02) {
        grid[y][x] = glyphs[Math.floor(Math.random() * glyphs.length)];
      }

      let isBright = false;
      if (isSkullTarget) {
        isBright = skullActive[y][x];
      } else {
        isBright = screenActive[y][x];
      }

      if (isBright) {
        ctx.fillStyle = '#66ffaa';
      } else {
        ctx.fillStyle = '#093022';
      }

      ctx.fillText(grid[y][x], x * CELL, y * CELL);
    }
  }
}

function loop() {
  draw();
  requestAnimationFrame(loop);
}

loop();
